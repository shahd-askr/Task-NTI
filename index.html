<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <label for="name">Full Name</label>
            <input id="name" type="text" placeholder="Your Name"/ required>
            <br>
        <label for="email">Your Email</label>
        <input id="email" type="email" placeholder="Email" required>    
        <br>
        <label for="phone">Whatsapp Number</label>
        <input id="phone" type="tel" placeholder="+020" required>
        <br>
        <label for="age">Your Age</label>
        <input id="age" type="number" min="18" max="30" required/>
        <br>
        <label for="birthdate">Birth Date</label>
        <input id="birthdate" type="date">
        <br>
        <label for="description">Why do you want to join us ?</label>
        <br>
        <textarea id="description" placeholder="feel free" cols="30" rows="10"></textarea>
        <br>
        <input type="submit">
    </form>
</body>
</html>
